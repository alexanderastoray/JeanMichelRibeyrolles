texte: |
  Les Gardiens de la Terre sont des messagers bienveillants et
  protecteurs, sans âge ni origine, porteurs de l’histoire de
  l’humanité.

  Ils témoignent de l’inquiétude d’un monde plongé dans
  l’incertitude absolue où paix et chaos se confondent.

  Ces témoins ne jugent pas, ne condamnent pas, mais
  rappellent aux vivants leurs devoirs et obligations.
