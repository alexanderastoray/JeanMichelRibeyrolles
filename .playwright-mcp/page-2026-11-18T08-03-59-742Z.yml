              - generic [ref=f8e45]:
                - paragraph [ref=f8e46]: Invitation à découvrir l’univers d’un sculpteur-musicien à l’ART’elier Samonteil.
                - paragraph [ref=f8e47]: Venez vous évader au milieu de ses œuvres réalisées seul ou à « 4 mains » et de ses instruments de musique.
                - paragraph [ref=f8e48]: Jean-Michel vous recevra dans une atmosphère musicale concoctée sur le moment, au gré de ses inspirations.
                - paragraph [ref=f8e49]: Pour vous accueillir un petit temps de préparation est nécessaire, nous vous invitons à nous contacter pour convenir ensemble de ce doux moment.
                - paragraph [ref=f8e50]:
                  - text: Ouverture de juin à octobre
