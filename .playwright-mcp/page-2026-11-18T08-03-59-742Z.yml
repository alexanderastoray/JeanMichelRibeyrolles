                  - generic [ref=f8e146]:
                    - generic [ref=f8e147]: Un voyage à travers les matières, accompagné par une douce musique qui nous laisse partir dans l’imaginaire et l’eau. Des œuvres en bois d’une bouleversante originalité. Merci pour ces découvertes !
                    - generic [ref=f8e150]:
                      - generic [ref=f8e151]: Marine
                      - generic [ref=f8e152]: Samedi 29 août 2020
                  - generic [ref=f8e155]:
                    - generic [ref=f8e156]: Un lieu unique. Un plaisir de regarder des pièces de plus en plus vivantes. Le bois, les tableaux, la terre.
                    - generic [ref=f8e159]:
                      - generic [ref=f8e160]: Valère
                      - generic [ref=f8e161]: Dimanche 30 août 2020
                  - generic [ref=f8e164]:
                    - generic [ref=f8e165]: Bravo pour cet espace et ce travail ! Touchée par vos œuvres, votre humanité et votre accueil ! Merci encore
                    - generic [ref=f8e168]:
                      - generic [ref=f8e169]: Caroline
                      - generic [ref=f8e170]: Dimanche 30 août 2020
                  - generic [ref=f8e173]:
                    - generic [ref=f8e174]: Merci, pièces d’exception ! Bravo et au plaisir d’une prochaine.
                    - generic [ref=f8e177]:
                      - generic [ref=f8e178]: Sophie
                      - generic [ref=f8e179]: Mercredi 2 septembre 2020
                - generic [ref=f8e181]:
                  - generic [aria-hidden] [ref=f8e186]: 
                  - generic [ref=f8e189]:
                    - generic [ref=f8e190]: A Samonteil, derrière le rideau Home, nous sommes délicatement invité à entrer dans un dialogue sensible et inspirant entre sculpture et peinture, où l’on se sent en confiance dans une scénographie si douce. On ne se sent ni l’envie, ni le courage de partir. Cette exposition éphémère ne nous laissera pas sans souvenir. Un grand merci admiratif
                    - generic [ref=f8e193]:
                      - generic [ref=f8e194]: Patrick et Jacquie
                      - generic [ref=f8e195]: Dimanche 30 août 2020
                  - generic [ref=f8e198]:
                    - generic [ref=f8e199]: Un régal pour les yeux, une vraie nourriture de l’âme, tant par les œuvres que par l’énergie du lieu et des artistes. Merci
                    - generic [ref=f8e202]:
                      - generic [ref=f8e203]: Audrey
                      - generic [ref=f8e204]: Dimanche 30 août 2020
                  - generic [ref=f8e207]:
                    - generic [ref=f8e208]: Ravie de m’imprégner encore plus de ton univers riche, onirique, spirituel, profond et expert. Belles vibrations vécues, entendues, partagées. Merci. A très bientôt. Amitiés
                    - generic [ref=f8e211]:
                      - generic [ref=f8e212]: Estelle – Stel H
                      - generic [ref=f8e213]: Dimanche 30 août 2020
                  - generic [ref=f8e216]:
                    - generic [ref=f8e217]: Merci pour ce joli moment. Belle réussite pour votre espace d’expo. Belle évolution dans le travail de vos pièces, j’aime beaucoup l’alliance avec le métal. Magnifique ! Super accueil musical
                    - generic [ref=f8e220]:
                      - generic [ref=f8e221]: Stef
                      - generic [ref=f8e222]: Mercredi 2 septembre 2020
                - generic [ref=f8e224]:
                  - generic [aria-hidden] [ref=f8e229]: 
                  - generic [ref=f8e232]:
                    - generic [ref=f8e233]: Je suis sous le charme du lieu, de la musique….tout a été pensé, jusqu’à la fluidité du rideau. Il s’ouvre sur autant d’œuvres (de chefs) s’harmonisant parfaitement avec leurs voisines, séduisant la visiteuse, subjuguée, j’éprouve un sentiment de plénitude. Félicitations à tous et MERCI . Amicalement
                    - generic [ref=f8e236]:
                      - generic [ref=f8e237]: Colette
                      - generic [ref=f8e238]: Dimanche 30 août 2020
                  - generic [ref=f8e241]:
                    - generic [ref=f8e242]: Touchée par le vivant, la gaieté et la sérénité du lieu et des personnes qui le rayonnent.
                    - generic [ref=f8e245]:
                      - generic [ref=f8e246]: Michèle
                      - generic [ref=f8e247]: Dimanche 30 août 2020
                  - generic [ref=f8e250]:
                    - generic [ref=f8e251]: La vie est belle j’ai enfin trouvé mon « coup de cœur ». Merci pour cette superbe expo et à bientôt.
                    - generic [ref=f8e254]:
                      - generic [ref=f8e255]: Brigitte
                      - generic [ref=f8e256]: Lundi 31 août 2020
                  - generic [ref=f8e259]:
                    - generic [ref=f8e260]: Jolie exposition. Très beau travail. Juste magnifique, un joli moment d’évasion.
                    - generic [ref=f8e263]:
                      - generic [ref=f8e264]: Chantal et Michel
                      - generic [ref=f8e265]: Jeudi 3 septembre 2020
