              - heading "Les Miroirs d’Enigme" [level=2] [ref=f5e39]
              - generic [ref=f5e44]:
                - paragraph [ref=f5e45]:
                  - text: Il y a quelque 3000 ans des hommes et des femmes entreprenaient des voyages périlleux pour se retrouver seuls avec les
                  - emphasis [ref=f5e46]: Miroirs d’Enigme
                  - text: .On ne sait dans quels coeurs a germé l’utopie poétique des
                  - emphasis [ref=f5e47]: Miroirs
                  - text: .
                - paragraph [ref=f5e48]: On ne sait quelles mains ont donné corps et matière à ce qui pourrait n’être qu’un mirage de l’inconscient collectif ?
                - paragraph [ref=f5e49]:
                  - text: Nul ne sait qui a protégé les
                  - emphasis [ref=f5e50]: Miroirs
                  - text: ", ni quel fut leur périple à travers le chaos des temps ?"
