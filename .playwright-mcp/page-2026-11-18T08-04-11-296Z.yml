            - generic [ref=f9e34]:
              - heading "Messager du néolithique" [level=2] [ref=f9e37]
              - generic [ref=f9e43]:
                - paragraph [ref=f9e44]: La sculpture et la musique ont fait irruption dans la vie de Jean-Michel RIBEYROLLES il y a longtemps. Les deux s’accordent et se répondent en parfaite complicité. Quand le sculpteur expose ses œuvres, il arrive que le musicien improvise quelques notes à l’accordéon ou au violon.
                - paragraph [ref=f9e45]: « Musique et sculpture c’est pour moi la même chose, la liberté d’improvisation, la créativité à l’état pur »
            - generic [ref=f9e59]:
              - paragraph [ref=f9e60]:
                - text: L’univers de
                - strong [ref=f9e61]: JmiR
                - text: est profondément inspiré par le monde néolithique, les représentations grand format des premières traces de l’homme, les dolmens, les statues menhirs ou les imposants cairns. Qui sont ces bâtisseurs, avec quelles techniques et connaissances ont-ils pu créer ces formes ? C’est tout le champ libre laissé par le silence à ces questions qui est source d’inspiration, de dialogue, de recherches.
              - paragraph [ref=f9e62]:
                - text: Les sculptures de
                - strong [ref=f9e63]: JmiR
                - text: forment une constellation de points, comme un arc tendu qui nous relie à ces origines insondables, à la nature, à l’espace.
              - paragraph [ref=f9e64]: « Quand j’attaque une pièce je me laisse guider par des impulsions. La sculpture se construit au fur et à mesure. Je cherche toujours à créer de la transparence, des effets de lumière en jouant avec le noir du bois brûlé, les dégradés orangers du Douglas, les reflets argentés du fer ».
            - generic [ref=f9e70]:
              - paragraph [ref=f9e71]:
                - text: A côté de son atelier qui plonge dans les vallons du Lot bordés par les tours du château de Saint-Laurent et la masse ocre de la forteresse de Castelneau,
                - strong [ref=f9e72]: JmiR
                - text: a aménagé une pièce claire et nue où il installe ses sculptures avec lesquelles il continue de dialoguer. « Cette pièce est un espace de vérité. Quand je passe devant les sculptures, quand je les regarde, il doit se passer quelque chose, des émotions, des sensations, comme un courant magnétique. Si je ne ressens rien, je les détruis.
              - paragraph [ref=f9e73]: La sculpture est terminée quand elle trouve sa place, son équilibre dans l’espace ».
              - paragraph [ref=f9e74]:
                - text: Dans son musée imaginaire sur le causse du Ségala,
                - strong [ref=f9e75]: JmiR
                - text: rêve au jour naissant qui dévoile des sculptures où vibrent les matières ancestrales de l’humanité, bois, fer, pierre. Dans l’ombre profonde d’un dolmen, un violoniste improvise…
              - paragraph [ref=f9e76]: Patrick Churlet
