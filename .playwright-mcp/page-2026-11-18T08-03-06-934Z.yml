            - generic [ref=f6e36]:
              - heading "Les Gardiens de la Terre" [level=2] [ref=f6e39]
              - generic [ref=f6e44]:
                - paragraph [ref=f6e45]: Les Gardiens de la Terre sont des messagers bienveillants etprotecteurs, sans âge ni origine, porteurs de l’histoire de l’humanité.
                - paragraph [ref=f6e46]: Ils témoignent de l’inquiétude d’un monde plongé dansl’incertitude absolue où paix et chaos se confondent.
                - paragraph [ref=f6e47]: Ces témoins ne jugent pas, ne condamnent pas, maisrappellent aux vivants leurs devoirs et obligations.
