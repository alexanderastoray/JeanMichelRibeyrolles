              - generic [ref=f4e44]:
                - paragraph [ref=f4e45]: Qui révélera l’énigme des origines du noir, lorsque dans un temps enfoui, les sept couleurs de l’arc-en-ciel emportées dans un mouvement insenséroulèrent les unes contre les autres, jusqu’à l‘effacement, la nudité absolue, pour rendre au noir toute sa clarté, sa puissance sauvage,pour l’affranchir de son exil.
                - paragraph [ref=f4e46]: Sous le noir vibrent tous nos arcs-en-ciel.
